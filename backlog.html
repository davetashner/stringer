const DATA = {"generated": "2026-09-19 01:30 UTC", "epics": [{"id": "stringer-043", "title": "L1: Language Support Expansion", "description": "Expand stringer's file-based heuristics beyond Go/JS/Python to support Java, Rust, C#, and other common languages. Covers test detection, test counterpart lookup, and dependency health parsing for each ecosystem.", "status": "open", "priority": 2, "issue_type": "epic", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-02-09T21:38:20Z", "created_by": "Dave Tashner", "updated_at": "2026-02-09T21:38:20Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0, "children": [{"id": "stringer-043.9", "title": "Language-aware test file detection in patterns collector", "description": "The patterns collector's test-file heuristic assumes Go naming (foo_test.go). This produces false positives in every non-Go ecosystem:\n- Python: centralized test files (tests/test_basic.py) not matched\n- Java: *Tests.java suffix not recognized\n- Rust: inline #[cfg(test)] modules not detected\n- JS: test/*.js directory convention missed\n- C#: FooTests.cs in separate project not matched\n\nDetected in cross-language evaluation (PR #180): 23 FP in Flask, 42 FP in Spring Petclinic.\n\nFix: detect project language from manifest files, apply per-language test naming conventions. For Rust, scan for #[cfg(test)] inline modules.", "status": "closed", "priority": 1, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-02-12T21:30:36Z", "created_by": "Dave Tashner", "updated_at": "2026-02-12T21:41:42Z", "closed_at": "2026-02-12T21:41:42Z", "close_reason": "Completed in PR #181", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-043.8", "title": "L1.8: Multi-ecosystem dep health", "description": "Extend the dephealth collector to parse dependency manifests beyond go.mod:\n- package.json (npm/Node.js) \u2014 check npm registry for deprecated packages\n- Cargo.toml (Rust) \u2014 check crates.io for yanked crates\n- pom.xml / build.gradle (Java) \u2014 check Maven Central\n- .csproj (C#) \u2014 check NuGet\n- requirements.txt / pyproject.toml (Python) \u2014 check PyPI\n\nEach ecosystem needs: manifest parser, registry API client, archived/deprecated detection. Consider a pluggable architecture so ecosystems can be added independently.", "status": "closed", "priority": 2, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-02-09T21:39:04Z", "created_by": "Dave Tashner", "updated_at": "2026-02-11T18:10:44Z", "closed_at": "2026-02-11T18:10:44Z", "close_reason": "Completed in PR #158", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-043.3", "title": "L1.3: C#/.NET ecosystem support", "description": "Add C#/.NET-specific heuristics:\n- Add isTestFile patterns: *Tests.cs, *Test.cs (NUnit/xUnit/MSTest conventions)\n- Add hasTestCounterpart: look in parallel .Tests project directories (e.g., MyApp/Foo.cs \u2192 MyApp.Tests/FooTests.cs)\n- Add dep health parsing for .csproj files \u2014 extract PackageReference elements, check NuGet package status\n- Recognize solution structure (.sln files) for multi-project repos", "status": "closed", "priority": 2, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-02-09T21:38:37Z", "created_by": "Dave Tashner", "updated_at": "2026-02-10T23:39:59Z", "closed_at": "2026-02-10T23:39:59Z", "close_reason": "Completed in PR #154", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-043.2", "title": "L1.2: Rust ecosystem support", "description": "Add Rust-specific heuristics:\n- Detect inline test modules (#[cfg(test)] mod tests) \u2014 these are NOT separate files, so missing-test should check file contents before flagging\n- Recognize tests/ directory for integration tests (tests/*.rs)\n- Add dep health parsing for Cargo.toml \u2014 extract dependencies, detect yanked/deprecated crates\n- Recognize bench files (benches/*.rs) to avoid false missing-test signals", "status": "closed", "priority": 2, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-02-09T21:38:32Z", "created_by": "Dave Tashner", "updated_at": "2026-02-10T23:39:57Z", "closed_at": "2026-02-10T23:39:57Z", "close_reason": "Completed in PR #154", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-043.1", "title": "L1.1: Java/Kotlin Maven/Gradle test tree detection", "description": "Improve Java/Kotlin test detection for Maven/Gradle project layouts:\n- Recognize Maven/Gradle parallel test tree: src/test/java/... mirrors src/main/java/...\n- Add hasTestCounterpart lookup that strips src/main/{java,kotlin,scala} and checks src/test/{java,kotlin,scala}\n- Dep health parsing for pom.xml/build.gradle deferred to stringer-043.8 (multi-ecosystem dep health)\n\nEstimated ~30-40 lines including tests.", "status": "closed", "priority": 2, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-02-09T21:38:26Z", "created_by": "Dave Tashner", "updated_at": "2026-02-09T21:49:31Z", "closed_at": "2026-02-09T21:49:31Z", "close_reason": "Completed in PR #132", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-043.7", "title": "L1.7: Elixir/Erlang test detection", "description": "Add Elixir/Erlang-specific heuristics:\n- Add .ex and .exs to sourceExtensions\n- Add isTestFile: *_test.exs\n- Add hasTestCounterpart: lib/foo.ex \u2192 test/foo_test.exs\n- Add # comment prefix for TODO scanning (already supported)\n- Consider mix.exs for dep health parsing", "status": "open", "priority": 3, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-02-09T21:38:56Z", "created_by": "Dave Tashner", "updated_at": "2026-02-09T21:38:56Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-043.6", "title": "L1.6: Scala test detection", "description": "Add Scala-specific heuristics:\n- isTestFile already recognizes *Test.scala and *Spec.scala (via Java/Kotlin rules) \u2014 verify and add explicit cases if needed\n- Add hasTestCounterpart for sbt convention: src/main/scala/... \u2192 src/test/scala/...\n- Consider build.sbt for dep health parsing", "status": "open", "priority": 3, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-02-09T21:38:52Z", "created_by": "Dave Tashner", "updated_at": "2026-02-09T21:38:52Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-043.5", "title": "L1.5: Swift test detection", "description": "Add Swift-specific heuristics:\n- Add isTestFile: *Tests.swift (XCTest convention)\n- Add hasTestCounterpart: Foo.swift \u2192 FooTests.swift\n- Recognize XCTest target directories in Xcode project structure\n- Consider Package.swift for dep health (SwiftPM dependencies)", "status": "open", "priority": 3, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-02-09T21:38:47Z", "created_by": "Dave Tashner", "updated_at": "2026-02-09T21:38:47Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-043.4", "title": "L1.4: PHP test detection", "description": "Add PHP-specific heuristics:\n- Add isTestFile: *Test.php (PHPUnit convention)\n- Add hasTestCounterpart: FooController.php \u2192 FooControllerTest.php\n- Recognize tests/ directory convention\n- Add .php to sourceExtensions (already present) and ensure comment prefix // and # both work for TODO scanning (already supported)", "status": "open", "priority": 3, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-02-09T21:38:43Z", "created_by": "Dave Tashner", "updated_at": "2026-02-09T21:38:43Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}]}, {"id": "stringer-w1d", "title": "Opportunity-axis surfacing (DR-022)", "description": "Add an additive opportunity-framing axis to Stringer alongside the existing debt axis. Re-read deterministic signals through a published whitelist and label them stringer-opportunity. Tracked under DR-022 (docs/decisions/022-opportunity-axis.md).\n\nDecisions made:\n- Q1: 13-kind Layer 1 whitelist (Arcan-shaped FP bar)\n- Q2: layered positioning ('codebase archaeology' tagline + 'opportunity mode' surface)\n- Q3: self-triage on 10-repo benchmark with bias disclosure; external user study planned as follow-up bead\n- Q4: Layer 3 cross-collector synthesis built only on explicit Tier-1 user request\n- Q5: extend baseline reasons with 'deferred' and 'out-of-scope'\n\nChildren:\n- Layer 0: github.go correctness fix (preserve original Kind on stale-issue override)\n- Layer 1: opportunity package + whitelist + buildLabels injection + report section\n- Layer 4: baseline reasons extension\n- Follow-up: external user study planning\n\nStrict-semver-additive only. No RawSignal field changes, no dedup-hash changes, no new bead type. --no-llm remains the default path. Marketing-vocabulary guardrails enforced: 'opportunity discovery', 'AI-powered' (in this context), and 'roadmap' are forbidden in README, MCP descriptors, and release notes.", "status": "open", "priority": 2, "issue_type": "epic", "owner": "kglynn@pryoninc.com", "created_at": "2026-04-26T06:45:33Z", "created_by": "kev", "updated_at": "2026-04-26T06:45:33Z", "labels": ["dr-022", "epic", "opportunity-axis"], "dependency_count": 0, "dependent_count": 0, "comment_count": 0, "children": [{"id": "stringer-w1d.2", "title": "Layer 1: opportunity package + 13-kind whitelist + buildLabels injection + report section", "description": "Ship the smallest opportunity-framing surface as additive, deterministic-only, no LLM dependency.\n\nFiles to create:\n- internal/opportunity/kinds.go \u2014 exported map[string]Descriptor seeded with the Layer 1 13-kind whitelist + IsOpportunityKind(kind string) bool\n- internal/opportunity/kinds_test.go \u2014 (a) drift test: every whitelist entry corresponds to a kind emitted by a registered collector; (b) TestWhitelistExcludesNeverKinds: the Bottom-5 (vulnerable-dependency, committed-secret, merge-conflict-marker, yanked-dependency/retracted-version, github-review-todo) are never opportunity-labeled\n- internal/report/opportunities.go \u2014 new section, registers via init(); reads ScanResult.Signals; renders grouped counts table + top-5-per-kind by confidence\n- internal/report/opportunities_test.go \u2014 golden rendering test + integration test invoking 'stringer report --sections opportunities'\n- docs/decisions/022-opportunity-axis.md \u2014 DR; status flips Proposed \u2192 Accepted in this PR\n\nFiles to modify:\n- internal/output/beads.go (buildLabels around lines 222-238) \u2014 three-line check: if opportunity.IsOpportunityKind(sig.Kind) { labels = append(labels, \"stringer-opportunity\") }\n- internal/collectors/todos.go \u2014 populate Description with the TODO body (precision improvement; addresses taxonomy gap #3)\n- AGENTS.md Key Design Decisions section \u2014 document the opportunity-axis rule (deterministic-only; central label injection off Kind; opportunity path forbidden from importing internal/llm or internal/analysis; opportunity signals capped at P3 unless promoted)\n- README.md \u2014 add the 'Repository Intelligence' framing paragraph in 'Why Stringer?' (per the language committed in DR-022 \u00a75)\n\nLayer 1 whitelist (13 kinds):\n1. unimplemented-route (apidrift)\n2. circular-dependency (coupling)\n3. github-feature (github)\n4. github-pr-approved (github)\n5. inconsistent-defaults (configdrift)\n6. env-var-drift (configdrift)\n7. code-clone (duplication)\n8. local-replace (dephealth)\n9. high-coupling (coupling)\n10. complex-function (complexity)\n11. undocumented-route (apidrift)\n12. doc-code-drift (docstale)\n13. broken-doc-link (docstale)\n\nArchitectural guard: CI grep test asserting no file under internal/opportunity/ or internal/report/opportunities*.go imports internal/llm or internal/analysis.\n\nMarketing-vocabulary guard (release-blocking): the strings 'opportunity discovery', 'AI-powered' (in the opportunity context), and 'roadmap' must not appear in README, MCP tool descriptors, or release notes.\n\nSemver: fully additive. No new bead type, no RawSignal field, no dedup-hash change, no new CLI flag, no new MCP tool. New Kind strings (already-emitted by collectors) and a new label string only.\n\nDepends on stringer-w1d.1 landing first.", "status": "open", "priority": 2, "issue_type": "task", "owner": "kglynn@pryoninc.com", "created_at": "2026-04-26T06:49:46Z", "created_by": "kev", "updated_at": "2026-04-26T06:49:46Z", "labels": ["collectors", "dr-022", "epic", "layer-1", "opportunity-axis", "output", "report"], "dependencies": [{"issue_id": "stringer-w1d.2", "depends_on_id": "stringer-w1d", "type": "parent-child", "created_at": "2026-04-26T02:49:45Z", "created_by": "kev", "metadata": "{}"}, {"issue_id": "stringer-w1d.2", "depends_on_id": "stringer-w1d.1", "type": "blocks", "created_at": "2026-04-26T02:50:00Z", "created_by": "kev", "metadata": "{}"}], "dependency_count": 1, "dependent_count": 1, "comment_count": 0, "parent": "stringer-w1d"}, {"id": "stringer-w1d.1", "title": "Layer 0: github.go preserves original Kind on stale-issue override", "description": "Fix correctness bug in internal/collectors/github.go:305-310 where the stale-issue override unconditionally writes Kind=\"github-stale-issue\", silently destroying the original github-feature classification on stale feature issues. This bug masks ~30% of real github-feature signals today and is independently warranted regardless of the opportunity-axis rollout.\n\nChange:\n- Preserve the originally-classified Kind (e.g., github-feature, github-bug)\n- Append \"stale\" to Tags\n- Multiply Confidence by 0.7\n\nTest required:\n- New unit test asserting stale path preserves the original Kind for a feature-labeled issue.\n\nSemver: additive. One-time delta spike on first scan after the fix as users with existing github-stale-issue baseline suppressions see new hashes; document in release notes.\n\nShips as its own PR before Layer 1.", "status": "open", "priority": 2, "issue_type": "task", "owner": "kglynn@pryoninc.com", "created_at": "2026-04-26T06:49:01Z", "created_by": "kev", "updated_at": "2026-04-26T06:49:01Z", "labels": ["bugfix", "collectors", "dr-022", "epic", "layer-0", "opportunity-axis"], "dependencies": [{"issue_id": "stringer-w1d.1", "depends_on_id": "stringer-w1d", "type": "parent-child", "created_at": "2026-04-26T02:49:00Z", "created_by": "kev", "metadata": "{}"}], "dependency_count": 0, "dependent_count": 1, "comment_count": 0, "parent": "stringer-w1d"}, {"id": "stringer-w1d.3", "title": "Layer 4: extend baseline reasons with deferred + out-of-scope", "description": "Add two new valid suppression reasons to internal/baseline/baseline.go to enable per-kind acceptance-rate telemetry (Q3) by distinguishing 'real opportunity, not now' (deferred) and 'real opportunity, not for this project' (out-of-scope) from 'won't-fix'/'acknowledged'.\n\nFiles to modify:\n- internal/baseline/baseline.go around lines 39-54 \u2014 add ReasonDeferred and ReasonOutOfScope constants; add to validReasons map; update the error message in ValidateReason to enumerate all 5 valid reasons\n- internal/baseline/baseline_test.go \u2014 assert both new reasons accepted by ValidateReason\n- README/AGENTS.md \u2014 document the new reasons under the baseline subcommand reference\n- Release notes \u2014 call out additive-with-caveats: the error message text changes; scripts matching on the old enumerated set may see different output\n\nMirrors the CodeScene three-state lifecycle (Planned Refactoring / Supervise / No Problem) from DR-022 \u00a76.\n\nSemver: additive-with-caveats. Documented in release notes.\n\nDepends on Layer 1 (stringer-w1d.2) landing first to maximise telemetry value.", "status": "open", "priority": 3, "issue_type": "task", "owner": "kglynn@pryoninc.com", "created_at": "2026-04-26T06:49:47Z", "created_by": "kev", "updated_at": "2026-04-26T06:49:47Z", "labels": ["baseline", "dr-022", "epic", "layer-4", "opportunity-axis"], "dependencies": [{"issue_id": "stringer-w1d.3", "depends_on_id": "stringer-w1d.2", "type": "blocks", "created_at": "2026-04-26T02:50:01Z", "created_by": "kev", "metadata": "{}"}, {"issue_id": "stringer-w1d.3", "depends_on_id": "stringer-w1d", "type": "parent-child", "created_at": "2026-04-26T02:49:46Z", "created_by": "kev", "metadata": "{}"}], "dependency_count": 1, "dependent_count": 0, "comment_count": 0, "parent": "stringer-w1d"}, {"id": "stringer-w1d.4", "title": "Plan + execute external user study for Layer 2 evidence", "description": "Design and run a small external user study to complement the self-triage on the 10-repo benchmark (DR-022 Q3 default) before promoting any Layer 1 deferred kinds (near-clone, low-lottery-risk, stale-doc, large-file, stale-api-version, dead-config-key, review-concentration) to Layer 2.\n\nGoal: per-kind acceptance-rate, defer-rate, and false-positive-rate from N\u22653 external adopters across at least two follow-up scans.\n\nPhases:\n1. Define participant criteria (active maintainers; repo size > X; willing to triage stringer-opportunity output for \u22652 weeks)\n2. Recruit (via stringer GitHub issues, Beads community, project newsletters)\n3. Build the per-kind feedback capture mechanism (ties to Layer 4: deferred + out-of-scope reasons)\n4. Run study + analyze\n5. Promote / hold / drop each Layer-2-candidate kind based on per-kind data\n\nActs as the 'honest evidence' counterpart to the self-triage default. Promotion to Layer 2 is gated on telemetry from this study OR equivalent self-triage data the maintainer chooses to publish with bias disclosure.\n\nLower priority (P3) \u2014 does not block Layer 1 ship.", "status": "open", "priority": 3, "issue_type": "task", "owner": "kglynn@pryoninc.com", "created_at": "2026-04-26T06:49:47Z", "created_by": "kev", "updated_at": "2026-04-26T06:49:47Z", "labels": ["dr-022", "epic", "evidence", "layer-2", "opportunity-axis", "research"], "dependencies": [{"issue_id": "stringer-w1d.4", "depends_on_id": "stringer-w1d", "type": "parent-child", "created_at": "2026-04-26T02:49:47Z", "created_by": "kev", "metadata": "{}"}], "dependency_count": 0, "dependent_count": 0, "comment_count": 0, "parent": "stringer-w1d"}]}, {"id": "stringer-7yj", "title": "UX2: User Research & Persona Validation", "description": "Research tasks to validate product assumptions before building features. Define target personas, draft interview guides, and answer key design questions: how many beads is too many? Is --no-llm the real MVP? What does confidence mean to a user? Outputs inform defaults, filtering strategy, and LLM epic prioritization. Unblocked; can start immediately.", "status": "open", "priority": 2, "issue_type": "epic", "owner": "dave@mainstreetlogic.com", "created_at": "2026-02-07T15:35:30Z", "created_by": "Dave Tashner", "updated_at": "2026-02-07T15:35:30Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0, "children": [{"id": "stringer-7yj.4", "title": "UX2.4: Validate LLM-optional positioning", "description": "Key product question: is --no-llm the real MVP, or do users expect clustering out of the box? The LLM pass (clustering 12 TODOs into one epic) is the most compelling feature in the README, but it requires an API key and has per-scan cost. Determine: (1) Would users try stringer without an API key first? (2) Is deterministic-only a hard requirement for some users (CI, air-gapped)? (3) Does the value prop collapse without clustering? Output informs whether LLM epics stay P2 or get promoted.", "status": "open", "priority": 2, "issue_type": "task", "owner": "dave@mainstreetlogic.com", "created_at": "2026-02-07T15:36:13Z", "created_by": "Dave Tashner", "updated_at": "2026-02-07T15:36:13Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-7yj.3", "title": "UX2.3: Validate noise tolerance thresholds", "description": "Research question: at what bead count does a stringer-bootstrapped backlog feel overwhelming vs. useful? If users feel overwhelmed at 50 beads, generating 300 is a product failure even if they're all legitimate. Determine whether stringer needs: (1) A default --max-issues cap. (2) More aggressive default --min-confidence. (3) A tiered output (top 20 high-confidence first, full set available via flag). Output directly informs C1 confidence defaults and pipeline filtering strategy.", "status": "open", "priority": 2, "issue_type": "task", "owner": "dave@mainstreetlogic.com", "created_at": "2026-02-07T15:36:08Z", "created_by": "Dave Tashner", "updated_at": "2026-02-07T15:36:08Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-7yj.2", "title": "UX2.2: Draft user interview guide", "description": "Create a structured interview guide for conversations with potential stringer users. Organized into sections: (1) Legacy codebase context \u2014 size, languages, age, contributor count. (2) Current pain points \u2014 how they discover tech debt today, onboarding friction. (3) Beads workflow \u2014 how many open issues feels manageable, agent vs. human workflows. (4) Trust and control \u2014 review-before-import preference, handling disagreements with generated issues. (5) Competitive landscape \u2014 experience with SonarQube/CodeClimate, differentiation. Artifact lives in docs/research/.", "status": "open", "priority": 2, "issue_type": "task", "owner": "dave@mainstreetlogic.com", "created_at": "2026-02-07T15:36:03Z", "created_by": "Dave Tashner", "updated_at": "2026-02-07T15:36:03Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-7yj.1", "title": "UX2.1: Define target user personas", "description": "Document 2-3 target user personas for stringer. Candidates: (1) Solo dev adopting beads on a legacy Rails/Django/Spring monolith \u2014 wants quick bootstrap, nervous about noise. (2) Team lead onboarding AI agents to a microservices repo \u2014 wants structured backlog, cares about priority accuracy. (3) OSS maintainer using beads for contributor onboarding \u2014 wants to surface good-first-issues from existing signals. Clarify who we're building for and whose needs take priority when they conflict.", "status": "open", "priority": 2, "issue_type": "task", "owner": "dave@mainstreetlogic.com", "created_at": "2026-02-07T15:35:59Z", "created_by": "Dave Tashner", "updated_at": "2026-02-07T15:35:59Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}]}], "standalone": [{"id": "stringer-td1", "title": "Accept DR-013 (Complexity Hotspot Collector)", "description": "DR-013 has been in 'Proposed' status since 2026-02-21 despite the complexity collector shipping in production (internal/collectors/complexity.go with a 1119-line test). Update Status to Accepted to align the record with reality.", "status": "open", "priority": 1, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-04-21T02:45:00Z", "created_by": "Dave Tashner", "updated_at": "2026-04-21T02:45:00Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-td6", "title": "Add coverage reporting and gate to CI", "description": "CI runs go test -race ./... but produces no coverage report. Enable -coverprofile on the existing test job and upload as an artifact, with an optional threshold check. 128 test files / 53.5K lines of tests without visibility is a maintenance risk.", "status": "open", "priority": 2, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-04-21T02:45:00Z", "created_by": "Dave Tashner", "updated_at": "2026-04-21T02:45:00Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-ds1", "title": "Add tests for L1 dephealth collectors and registry clients", "description": "The L1 expansion (PR #310) added Packagist and Hex registry clients (dephealth_packagist.go, dephealth_hex.go) and Swift/sbt parsers with zero collector-level or registry-client tests. dephealth_test.go has no TestCollect*Health for Swift/sbt/Packagist/Hex, and realPackagistRegistryClient / realHexRegistryClient have no tests at all. Add table-driven tests covering FetchPackage success/error/non-200 paths, abandoned/retired detection, and the check*Deps loop behavior including the cap.", "status": "open", "priority": 2, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-05-12T03:00:00Z", "created_by": "Dave Tashner", "updated_at": "2026-05-12T03:00:00Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-td4", "title": "Audit regex compilation in collector hot paths", "description": "Across collectors there are many regexp.MustCompile calls. PR #294 memoized deadcode; similar opportunities may exist in complexity.go branch counting and patterns.go. Add benchmarks to identify hot paths and cache or memoize where needed.", "status": "open", "priority": 2, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-04-21T02:45:00Z", "created_by": "Dave Tashner", "updated_at": "2026-04-21T02:45:00Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-ds2", "title": "Bound HTTP response body reads in dephealth registry clients", "description": "All six dephealth registry clients (npm, pypi, maven, crates, packagist, hex) decode resp.Body directly via json.NewDecoder with no size limit. A malicious or misconfigured registry could serve a multi-GB JSON body and OOM the scanner \u2014 up to 50 such payloads given the per-ecosystem check caps. Wrap resp.Body in an io.LimitReader with a sane cap (~10MB) in each client.", "status": "open", "priority": 2, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-05-12T03:00:00Z", "created_by": "Dave Tashner", "updated_at": "2026-05-12T03:00:00Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-38h", "title": "C13: Git Hygiene Detector", "description": "Detect git hygiene issues as high-confidence signals. Four signal types: (1) Large binary files committed to repo (not in .gitignore, not LFS-tracked). (2) Merge conflict markers left in files (<<<<<<, =======, >>>>>>>). (3) Committed secret patterns (API keys, tokens \u2014 gitleaks-style detection as signal, not gate). (4) Mixed line endings or inconsistent whitespace conventions per-project. All are trivially detectable, high-confidence, and always actionable. Low implementation effort.", "status": "open", "priority": 2, "issue_type": "task", "created_at": "2026-02-21T10:02:28Z", "updated_at": "2026-02-21T10:02:28Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-7el", "title": "C8: Dead Code Detector", "description": "Detect dead code as archaeological signals: unexported functions with zero callers, unused type definitions, orphaned files not imported/required by anything. Go-specific: leverage go vet or golang.org/x/tools/go/analysis for unused exports within internal packages. Language-agnostic heuristic: functions defined but never referenced across the codebase (low confidence). Fits stringer philosophy \u2014 archaeological signal, not lint rule.", "status": "open", "priority": 2, "issue_type": "task", "created_at": "2026-02-21T10:02:16Z", "updated_at": "2026-02-21T10:02:16Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-wmg", "title": "Investigate flaky 'context deadline exceeded' fuzz test failures", "description": "Fuzz jobs have failed twice this session with the exact same signature: a fuzz target fails with 'context deadline exceeded' right at the fuzz timer boundary (FuzzBeadParse on PR #427's CI run, FuzzSplitAndTrim on the v1.10.0 tag's Fuzz (Thorough) workflow). Both failures happen at exactly the configured fuzz duration, suggesting the harness's context deadline check races the corpus/coverage write rather than being genuine input-driven flakiness. Investigate the fuzz test harness (internal/beads fuzz target, internal/mcpserver FuzzSplitAndTrim) and the CI fuzz step's -fuzztime/-timeout handling; consider adding buffer between -fuzztime and the step's overall timeout, or using t.Context() correctly in the fuzz targets.", "status": "open", "priority": 2, "issue_type": "bug", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-09-17T00:38:54Z", "created_by": "Dave Tashner", "updated_at": "2026-09-17T00:38:54Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-311", "title": "Q3: Real-World Stress Test Suite", "description": "Run stringer against diverse real repos to find crashes, panics, surprising output, and edge cases before v1.0. Target repos: (1) stringer itself \u2014 dogfood on our own codebase, verify output makes sense. (2) Go stdlib (golang/go) \u2014 massive repo, thousands of files, deep history, tests our scalability and timeout handling. (3) A polyglot monorepo (e.g., googleapis/googleapis or nickel-org/nickel) \u2014 mixed languages, unusual directory structures, non-standard build systems. (4) A repo with no tags, no releases, minimal commit history \u2014 edge case for git-log and lotteryrisk collectors. (5) A repo with submodules, symlinks, and vendored dependencies. For each repo, capture: wall-clock time, memory high-water mark, any panics or errors, and a human review of whether the generated beads are reasonable. Fix any panics or crashes found. Document known limitations.", "status": "open", "priority": 2, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-02-12T20:54:27Z", "created_by": "Dave Tashner", "updated_at": "2026-02-12T20:54:27Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-5og", "title": "R3.1: Health Trend Analysis", "description": "Transform stringer from point-in-time scanner to continuous health monitor. Extend .stringer/last-scan.json to persist time-series history of signal counts. New report section showing: (1) Signal count trend \u2014 are TODOs accumulating or being resolved? (2) Churn velocity \u2014 is hotspot churn accelerating? (3) Debt trajectory \u2014 new signals per week vs resolved signals per week. (4) Directional indicators (improving/stable/degrading) per collector. Requires schema extension to delta scan state format.", "status": "open", "priority": 2, "issue_type": "task", "created_at": "2026-02-21T10:02:31Z", "updated_at": "2026-02-21T10:02:31Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-jfh", "title": "Re-run README benchmark on main after the stringer-nxx fixes (post-v1.10.0 dev build)", "description": "Re-run eval/bench.sh across the same 13 repos on a build of main (b945f64, after PRs #431-#448) under caffeinate -i, compare per-collector counts and monotonic timings with the v1.10.0 run in docs/research/benchmark-2026-09.md, and refresh the README real-world results table. Record commit SHAs; note that repos have moved since 2026-09-16.", "status": "open", "priority": 2, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-09-19T01:27:03Z", "created_by": "Dave Tashner", "updated_at": "2026-09-19T01:27:03Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-td5", "title": "Refactor dephealth.go god object into per-ecosystem sub-collectors", "description": "internal/collectors/dephealth.go is ~13.4K lines with nine collect*Health methods for Go, npm, Cargo, Maven, NuGet, and PyPI. High coupling; a rate-limit issue in one ecosystem affects the whole collector. Plan only \u2014 see DR-019 for design options. Do not implement until the DR is accepted.", "status": "open", "priority": 2, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-04-21T02:45:00Z", "created_by": "Dave Tashner", "updated_at": "2026-04-21T02:45:00Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-td2", "title": "Replace time.Sleep in pipeline tests with deterministic sync", "description": "internal/pipeline/pipeline_test.go and internal/pipeline/integration_test.go use bare time.Sleep for synchronization. These flake on loaded CI runners. Replace with channel- or ctx-based coordination.", "status": "open", "priority": 2, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-04-21T02:45:00Z", "created_by": "Dave Tashner", "updated_at": "2026-04-21T02:45:00Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-td3", "title": "Return errors from collector/section Register (not panic)", "description": "internal/collector/collector.go and internal/report/section.go panic on duplicate registration. A stale blank import means the binary won't start with a stack trace rather than a clear message. Change Register signatures to return error and propagate from cmd/stringer/main; add tests for collision detection.", "status": "open", "priority": 2, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-04-21T02:45:00Z", "created_by": "Dave Tashner", "updated_at": "2026-04-21T02:45:00Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-kqf", "title": "UX4: README rewrite \u2014 broaden positioning beyond Beads", "description": "The README is too Beads-centric. Reframe stringer as a standalone codebase archaeology and health tool with Beads as one integration option. Highlight static analysis capabilities (vuln scanning, dep health, lottery risk, reports) as standalone value. Show multiple output formats in quick start. Move Beads to an integrations section.", "status": "open", "priority": 2, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-02-13T08:46:11Z", "created_by": "Dave Tashner", "updated_at": "2026-02-13T08:46:11Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-jfh.1", "title": "duplication: test-only gate misses directory-based test trees (express test/*.js)", "description": "Post-fix benchmark on main (b945f64): expressjs/express still hits the 200 duplication cap; all 200 signals are under test/ (express.json.js, res.json.js, req.host.js) but none are tagged test-only, so the min_test_lines=12 gate from PR #438 never applies and 6-line test blocks are emitted at ~0.44 confidence. The duplication collector classifies test files by filename convention only; the complexity collector (PR #434, isComplexityTestFile) and patterns (isTestOnlyDir) also treat test/, tests/, __tests__/, spec/ path segments as test code. Use the same directory-aware classifier in duplication.", "status": "open", "priority": 2, "issue_type": "bug", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-09-19T01:28:25Z", "created_by": "Dave Tashner", "updated_at": "2026-09-19T01:28:25Z", "dependencies": [{"issue_id": "stringer-jfh.1", "depends_on_id": "stringer-jfh", "type": "parent-child", "created_at": "2026-09-19T01:28:25Z", "created_by": "Dave Tashner", "metadata": "{}"}], "dependency_count": 0, "dependent_count": 0, "comment_count": 0, "parent": "stringer-jfh"}, {"id": "stringer-8xj", "title": "A6: Signal Grouping by Module/Package", "description": "Deterministic signal grouping without LLM dependency. Aggregate signals by Go package / directory / workspace module and produce per-module health scores. Output: 'the auth package has 12 signals (3 critical)' instead of flat list. Apply stringer report approach at the signal output level \u2014 module-scoped summaries in beads/JSON/markdown output. Complements LLM clustering for users without API keys. Addresses the flat-list overwhelm problem (522 signals on self-scan).", "status": "open", "priority": 3, "issue_type": "task", "created_at": "2026-02-21T10:02:34Z", "updated_at": "2026-02-21T10:02:34Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-td9", "title": "Add context cancellation in duplication/coupling hot loops", "description": "internal/collectors/duplication.go (FNV-64a sliding window) and internal/collectors/coupling_graph.go (Tarjan SCC) do not check ctx.Done() inside hot loops. Ctrl+C hangs for seconds on large repos. Plan only \u2014 see DR-021.", "status": "open", "priority": 3, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-04-21T02:45:00Z", "created_by": "Dave Tashner", "updated_at": "2026-04-21T02:45:00Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-td7", "title": "Automate AGENTS.md interface drift check via AST parse", "description": "The current Doc Staleness CI job hard-fails on grep-based signature comparison. Harden it by parsing the fenced code block for Collector/Formatter/Section interfaces and comparing to source via AST. Plan only \u2014 see DR-020.", "status": "open", "priority": 3, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-04-21T02:45:00Z", "created_by": "Dave Tashner", "updated_at": "2026-04-21T02:45:00Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-c9e", "title": "C10: API Contract Drift Detector", "description": "Detect drift between API specs and implementation. Find OpenAPI/Swagger spec files, extract route patterns, find handler registrations in code, flag mismatches. Also detect: routes with no corresponding spec entry, spec entries with no handler, stale API version prefixes (e.g. /v1/ routes in a project that moved to /v2/). Pragmatic regex-based approach, not full spec validation.", "status": "open", "priority": 3, "issue_type": "task", "created_at": "2026-02-21T10:02:21Z", "updated_at": "2026-02-21T10:02:21Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-6yf", "title": "C11: Configuration Drift Detector", "description": "Detect configuration cruft and drift. Three signal types: (1) Env var drift \u2014 grep for os.Getenv/process.env/ENV[] references vs documented env vars in .env.example/.env.template. (2) Dead config keys \u2014 config file keys not referenced in source code. (3) Inconsistent defaults \u2014 same config key with different default values across config files. Covers Go, Node, Python, Ruby ecosystems.", "status": "open", "priority": 3, "issue_type": "task", "created_at": "2026-02-21T10:02:23Z", "updated_at": "2026-02-21T10:02:23Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-59j", "title": "C12: Documentation Staleness Detector", "description": "Detect stale documentation that has drifted from the code it describes. Three signal types: (1) README/doc age vs code age \u2014 if src/auth/ was rewritten 6 months ago but docs/auth.md hasn't changed in 2 years, flag it. (2) Code-doc co-change ratio \u2014 files that change frequently but whose associated docs never change. (3) Broken internal links \u2014 markdown files referencing paths or function names that no longer exist. Uses git log for timestamps and grep for link validation.", "status": "open", "priority": 3, "issue_type": "task", "created_at": "2026-02-21T10:02:26Z", "updated_at": "2026-02-21T10:02:26Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-ds3", "title": "Check ctx cancellation in dephealth ecosystem loops", "description": "The per-ecosystem check loops in dephealth (npm, pypi, maven, crates, packagist, hex, deprecated/proxy, github) iterate over deps making registry calls but never check ctx.Err() in the loop body. The in-flight HTTP request is cancellable, but on Ctrl+C or CI timeout the loop keeps issuing fresh requests until the cap is hit. Add an early ctx.Err() check at the top of each loop, matching the pattern established by DR-021 / PR #309 for the duplication and coupling collectors.", "status": "open", "priority": 3, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-05-12T03:00:00Z", "created_by": "Dave Tashner", "updated_at": "2026-05-12T03:00:00Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-td12", "title": "Document decision record lifecycle", "description": "AGENTS.md describes DR format and rules but not lifecycle (Proposed \u2192 Accepted \u2192 Superseded \u2192 Archived). Add a Lifecycle subsection so future developers have clear guidance and none get stuck in 'Proposed' like DR-013.", "status": "open", "priority": 3, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-04-21T02:45:00Z", "created_by": "Dave Tashner", "updated_at": "2026-04-21T02:45:00Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-td8", "title": "Document signal-id stability contract in signalid.go", "description": "AGENTS.md states signal IDs are SHA-256 hashes with 'str-' prefix; the implementation in internal/output/signalid.go has no doc comments explaining the hash inputs. Silent changes to the hash composition orphan existing beads. Add a doc.comment and a regression test with fixed expected hashes.", "status": "open", "priority": 3, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-04-21T02:45:00Z", "created_by": "Dave Tashner", "updated_at": "2026-04-21T02:45:00Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-td10", "title": "Extract langSpec table for complexity collector language rules", "description": "internal/collectors/complexity.go has repeated regex definitions across 12+ language specs. Adding a language requires editing multiple functions. Extract into a single table-driven struct so new languages (PHP/Swift/Scala/Elixir per stringer-043) slot in cleanly.", "status": "open", "priority": 3, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-04-21T02:45:00Z", "created_by": "Dave Tashner", "updated_at": "2026-04-21T02:45:00Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-ds4", "title": "Make dephealth registry HTTP client timeout configurable", "description": "realPackagistRegistryClient and realHexRegistryClient hardcode a 30s http.Client timeout; the older ecosystem clients do similar. The value is not exposed via .stringer.yaml or CollectorOpts. On slow networks registry lookups fail silently (debug-level log only). Consider a single dephealth.registry-timeout config key applied to all ecosystem clients. Low priority \u2014 30s is fine for most users.", "status": "open", "priority": 3, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-05-12T03:00:00Z", "created_by": "Dave Tashner", "updated_at": "2026-05-12T03:00:00Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 1}, {"id": "stringer-td13", "title": "Replace interface{} in test fixtures with typed structs", "description": "internal/llm/anthropic_test.go, internal/output/beads_test.go, and internal/pipeline/integration_test.go unmarshal into map[string]interface{}. Test-only but a weak precedent. Define typed structs for fixtures.", "status": "open", "priority": 3, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-04-21T02:45:00Z", "created_by": "Dave Tashner", "updated_at": "2026-04-21T02:45:00Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-td11", "title": "Standardize slog usage and error field naming", "description": "Collectors mix slog.Warn(\"error\", err) with wrapped %w returns and lack consistent structured field names. Document logging contract in AGENTS.md and normalize across collectors.", "status": "open", "priority": 3, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-04-21T02:45:00Z", "created_by": "Dave Tashner", "updated_at": "2026-04-21T02:45:00Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-ds5", "title": "Update CLAUDE.md stale Current Focus section", "description": "CLAUDE.md Current Focus still lists 'Active epic: L1 Language Support Expansion (stringer-043)' as in-progress, but the L1 epic completed when PR #310 merged. Update the focus section to reflect current priorities.", "status": "open", "priority": 3, "issue_type": "task", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-05-12T03:00:00Z", "created_by": "Dave Tashner", "updated_at": "2026-05-12T03:00:00Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}, {"id": "stringer-gld", "title": "bd import -i - should support stdin convention", "description": "Running `stringer scan . | bd import -i -` fails with:\n\n```\nError opening input file: open -: no such file or directory\n```\n\nThe `-i -` convention for reading from stdin is a well-established Unix pattern used by tools like `cat`, `curl`, `tar`, `docker`, etc. Users naturally reach for `-i -` since the `-i` flag exists.\n\n**Current workaround:** `bd import` does read from stdin by default when `-i` is not specified, so `stringer scan . | bd import` works. However, the `-i -` form is so common in Unix tooling that users will try it first, especially since the stringer README likely documents a `stringer scan | bd import -i -` pipeline.\n\n**Proposed fix:** Treat `-` as a special value for the `-i` flag, meaning \"read from stdin.\" This is a trivial change (check if the filename is `\"-\"` and use `os.Stdin` instead of `os.Open`).\n\n**Note:** This is technically a beads issue rather than a stringer issue, but is filed here since it was discovered during stringer evaluation and affects the recommended stringer-to-beads pipeline.", "status": "open", "priority": 3, "issue_type": "feature", "owner": "5702882+davetashner@users.noreply.github.com", "created_at": "2026-02-08T12:15:54Z", "created_by": "Dave Tashner", "updated_at": "2026-02-08T12:15:54Z", "dependency_count": 0, "dependent_count": 0, "comment_count": 0}], "stats": {"total_open": 46, "priority_counts": {"1": 1, "2": 24, "3": 21}, "epic_count": 3}};

// State
let priorityFilter = "all";
let statusFilter = "all";

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}

function renderStats() {
  const s = DATA.stats;
  const dots = {1: "#8b5cf6", 2: "#da3633", 3: "#d29922", 4: "#484f58"};
  let html = `<span><span class="dot" style="background:#238636"></span>${s.total_open} open</span>`;
  html += `<span>${s.epic_count} epics</span>`;
  for (const p of [1,2,3,4]) {
    const c = s.priority_counts[p] || 0;
    if (c > 0) html += `<span><span class="dot" style="background:${dots[p]}"></span>P${p}: ${c}</span>`;
  }
  document.getElementById("stats").innerHTML = html;
}

function renderControls() {
  const prios = [1,2,3,4].filter(p => DATA.stats.priority_counts[p]);
  let html = `<button class="${priorityFilter==='all'?'active':''}" data-prio="all">All</button>`;
  for (const p of prios) {
    html += `<button class="${priorityFilter===String(p)?'active':''}" data-prio="${p}">P${p}</button>`;
  }
  html += `<div class="sep"></div>`;
  html += `<button class="${statusFilter==='all'?'active':''}" data-status="all">All status</button>`;
  html += `<button class="${statusFilter==='open'?'active':''}" data-status="open">Open</button>`;
  html += `<button class="${statusFilter==='closed'?'active':''}" data-status="closed">Closed</button>`;
  const el = document.getElementById("controls");
  el.innerHTML = html;
  el.querySelectorAll("[data-prio]").forEach(b => b.addEventListener("click", () => {
    priorityFilter = b.dataset.prio;
    render();
  }));
  el.querySelectorAll("[data-status]").forEach(b => b.addEventListener("click", () => {
    statusFilter = b.dataset.status;
    render();
  }));
}

function matchPriority(item) {
  if (priorityFilter === "all") return true;
  return String(item.priority) === priorityFilter;
}

function matchStatus(item) {
  if (statusFilter === "all") return true;
  return item.status === statusFilter;
}

function filterChildren(children) {
  return children.filter(c => matchStatus(c));
}

function renderBoard() {
  let html = "";

  // Epics
  const epics = DATA.epics.filter(matchPriority);
  if (epics.length > 0) {
    html += `<div class="section-header">Epics</div>`;
    for (const epic of epics) {
      const children = filterChildren(epic.children || []);
      const totalChildren = (epic.children || []).length;
      const openChildren = (epic.children || []).filter(c => c.status === "open").length;
      const closedChildren = totalChildren - openChildren;
      const childCountLabel = statusFilter === "all"
        ? `${openChildren} open / ${closedChildren} closed`
        : `${children.length} ${statusFilter}`;
      html += `<div class="epic-row" data-epic="${esc(epic.id)}">`;
      html += `<div class="epic-header">`;
      html += `<span class="epic-chevron">&#9654;</span>`;
      html += `<span class="priority-badge p${epic.priority || 4}">P${epic.priority || 4}</span>`;
      html += `<span class="epic-title">${esc(epic.title)}</span>`;
      html += `<span class="epic-id">${esc(epic.id)}</span>`;
      html += `<span class="child-count">${childCountLabel}</span>`;
      html += `</div>`;
      html += `<div class="children">`;
      if (children.length === 0) {
        html += `<div class="child-row"><span style="color:#484f58;font-size:12px">No ${statusFilter === "all" ? "" : statusFilter + " "}children</span></div>`;
      }
      for (const child of children) {
        const desc = (child.description || "").substring(0, 120);
        html += `<div class="child-row" data-issue='${JSON.stringify(child).replace(/'/g, "&#39;")}'>`;
        html += `<span class="child-id">${esc(child.id)}</span>`;
        html += `<span class="status-badge ${child.status === "open" ? "open" : "closed"}">${esc(child.status)}</span>`;
        html += `<span class="priority-badge p${child.priority || 4}">P${child.priority || 4}</span>`;
        html += `<span class="child-title">${esc(child.title)}</span>`;
        html += `<span class="child-desc">${esc(desc)}</span>`;
        html += `</div>`;
      }
      html += `</div></div>`;
    }
  }

  // Standalone tasks
  const tasks = DATA.standalone.filter(t => matchPriority(t) && matchStatus(t));
  if (tasks.length > 0) {
    html += `<div class="section-header">Tasks</div>`;
    for (const task of tasks) {
      html += `<div class="task-row" data-issue='${JSON.stringify(task).replace(/'/g, "&#39;")}'>`;
      html += `<span class="task-id">${esc(task.id)}</span>`;
      html += `<span class="status-badge ${task.status === "open" ? "open" : "closed"}">${esc(task.status)}</span>`;
      html += `<span class="priority-badge p${task.priority || 4}">P${task.priority || 4}</span>`;
      html += `<span class="task-title">${esc(task.title)}</span>`;
      html += `</div>`;
    }
  }

  if (epics.length === 0 && tasks.length === 0) {
    html += `<div class="empty-state">No issues match the current filters.</div>`;
  }

  document.getElementById("board").innerHTML = html;

  // Epic accordion
  document.querySelectorAll(".epic-header").forEach(h => {
    h.addEventListener("click", () => {
      h.parentElement.classList.toggle("expanded");
    });
  });

  // Child/task click -> modal
  document.querySelectorAll("[data-issue]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const issue = JSON.parse(el.dataset.issue);
      showModal(issue);
    });
  });
}

function showModal(issue) {
  document.getElementById("modal-title").textContent = issue.title || "";
  document.getElementById("modal-id").textContent = issue.id || "";
  let meta = `<span class="priority-badge p${issue.priority || 4}">P${issue.priority || 4}</span>`;
  meta += `<span class="status-badge ${issue.status === "open" ? "open" : "closed"}">${issue.status || ""}</span>`;
  if (issue.issue_type) meta += `<span style="font-size:11px;color:#7d8590">${esc(issue.issue_type)}</span>`;
  document.getElementById("modal-meta").innerHTML = meta;
  document.getElementById("modal-body").textContent = issue.description || "(no description)";
  document.getElementById("modal-overlay").classList.add("visible");
}

document.getElementById("modal-close").addEventListener("click", () => {
  document.getElementById("modal-overlay").classList.remove("visible");
});
document.getElementById("modal-overlay").addEventListener("click", (e) => {
  if (e.target === e.currentTarget) {
    e.currentTarget.classList.remove("visible");
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") document.getElementById("modal-overlay").classList.remove("visible");
});

function render() {
  renderStats();
  renderControls();
  renderBoard();
}

render();
</script>
</body>
</html>
