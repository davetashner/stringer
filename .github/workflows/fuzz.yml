name: Fuzz (Thorough)

on:
  schedule:
    - cron: "0 6 * * 1"  # Monday 6am UTC
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Fuzzing needs Go >= 1.27: earlier toolchains (including every
          # 1.26.x) have a race in internal/fuzz where the -fuzztime deadline
          # expiring is reported as a spurious "context deadline exceeded"
          # failure (https://go.dev/issue/75804, fixed in 1.27.0). Keep in
          # sync with the Fuzz job in ci.yml.
          go-version: "1.27"
      - name: Run thorough fuzz tests
        # -timeout is per `go test` invocation and must stay well above
        # -fuzztime plus baseline-coverage gathering and worker start-up.
        run: |
          go test -fuzz=^FuzzResolvePath$ -fuzztime=2m -timeout=5m -run=^$ ./internal/mcpserver/
          go test -fuzz=^FuzzSplitAndTrim$ -fuzztime=2m -timeout=5m -run=^$ ./internal/mcpserver/
          go test -fuzz=^FuzzConfigParse$ -fuzztime=2m -timeout=5m -run=^$ ./internal/config/
          go test -fuzz=^FuzzBeadParse$ -fuzztime=2m -timeout=5m -run=^$ ./internal/beads/
